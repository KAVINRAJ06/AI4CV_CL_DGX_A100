[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcl-sam-seg"
version = "0.1.0"
description = "Configuration-driven quantum continual learning for frozen-SAM satellite segmentation"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["qcl_sam_seg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
