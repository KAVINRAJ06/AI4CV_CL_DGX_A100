task:
  name: landcoverai
  order: 2
  head_id: landcoverai_5class
dataset:
  kind: landcoverai
  root: ../../../A100_datasets/landcover_ai
  splits:
    train: ../../../A100_datasets/landcover_ai/train.txt
    val: ../../../A100_datasets/landcover_ai/val.txt
    test: ../../../A100_datasets/landcover_ai/test.txt
  tiling: {size: 512}
  classes: [background, building, woodland, water, road]
  label_map: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
  ignore_index: 255
  validation_scan_limit: 32
  transforms:
    image_size: 1024
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]
model:
  backbone: sam_vit_b
  sam_model_type: vit_b
  sam_checkpoint: C:/models/sam_vit_b_01ec64.pth
  channels: 256
  qubits: 8
  quantum_layers: 4
  token_grid: 8
training: {epochs: 24, batch_size: 2, lr: 0.0001, weight_decay: 0.00001}
continual: {ewc_lambda: 1000.0, ewc_decay: 1.0, fisher_batches: 32}
evaluation: {num_visualizations: 12, tsne_samples: 1000, seed: 42}
output: {root: outputs}
